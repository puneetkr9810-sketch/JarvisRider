name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the GitHub Release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$V"
          echo "JR_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "JR_VERSION_CODE=$((MA * 10000 + MI * 100 + ${PA:-0}))" >> "$GITHUB_ENV"

      - name: Decode release signing key (from GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "JR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing key found."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - the release APK is signed with the debug key."
          fi

      - name: Lint, unit tests, debug + release builds
        env:
          JR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/JarvisRider.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/JarvisRider-debug.apk
          ls -la out
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/JarvisRider.apk | head -3 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisRider-apk
          path: out/*.apk

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/JarvisRider.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/JarvisRider.apk \
              --title "JarvisRider $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
